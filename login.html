<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Login | Prepify Tutoring</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <!-- Shared Navigation Bar -->
  <header class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="logo">Apex<span>Prep</span></a>
      <nav class="nav-links">
        <a href="index.html">← Back to Main Site</a>
      </nav>
    </div>
  </header>

  <!-- Centered Login Card -->
  <main class="auth-wrapper">
    <div class="card auth-card">
      <div class="auth-header">
        <h2>Learning Portal</h2>
        <p>Sign in to access your classes, tests, and progress.</p>
      </div>

      <!-- Role Tab Switcher -->
      <div class="role-tabs" role="tablist">
        <button
          type="button"
          class="tab-btn active"
          id="studentTab"
          role="tab"
          aria-selected="true"
          aria-controls="studentForm"
        >
          Student Login
        </button>
        <button
          type="button"
          class="tab-btn"
          id="teacherTab"
          role="tab"
          aria-selected="false"
          aria-controls="teacherForm"
        >
          Teacher Login
        </button>
      </div>

      <!-- Error / Status Banner (Hidden by default) -->
      <div id="authAlert" class="auth-alert hidden" role="alert"></div>

      <!-- STUDENT LOGIN FORM (Username + Teacher Passcode) -->
      <form id="studentForm" class="auth-form">
        <div class="form-group">
          <label for="studentUsername">Student Username</label>
          <input
            type="text"
            id="studentUsername"
            name="username"
            placeholder="e.g., alex_m"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="studentPasscode">Teacher-Issued Passcode</label>
          <input
            type="password"
            id="studentPasscode"
            name="passcode"
            placeholder="e.g., TIGER-482"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="form-group">
          <label for="classJoinCode">
            Class Join Code <span class="optional-label">(Optional)</span>
          </label>
          <input
            type="text"
            id="classJoinCode"
            name="classCode"
            placeholder="Enter code to join a new class"
            maxlength="12"
          />
        </div>

        <button type="submit" id="studentSubmitBtn" class="btn btn-primary full-width">
          Enter Student Portal
        </button>

        <p class="auth-help">
          Don't have a passcode or forgot yours? Ask your tutor during your next session to generate a new one.
        </p>
      </form>

      <!-- TEACHER LOGIN FORM (Email + Password) -->
      <form id="teacherForm" class="auth-form hidden">
        <div class="form-group">
          <label for="teacherEmail">Instructor Email</label>
          <input
            type="email"
            id="teacherEmail"
            name="email"
            placeholder="sarah@yourdomain.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="teacherPassword">Password</label>
          <input
            type="password"
            id="teacherPassword"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" id="teacherSubmitBtn" class="btn btn-primary full-width">
          Sign In to Teacher Studio
        </button>

        <p class="auth-help">
          Instructor accounts are invite-only. Contact the site administrator if you need access.
        </p>
      </form>
    </div>
  </main>

  <!-- Load Supabase & Auth Helpers FIRST -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="gradebook/supabase-client.js"></script>
  <script src="gradebook/auth.js"></script>

  <!-- Tab Switching & Live Supabase Auth Handlers -->
  <script>
    const studentTab = document.getElementById('studentTab');
    const teacherTab = document.getElementById('teacherTab');
    const studentForm = document.getElementById('studentForm');
    const teacherForm = document.getElementById('teacherForm');
    const authAlert = document.getElementById('authAlert');

    function showError(message) {
      authAlert.textContent = message;
      authAlert.classList.remove('hidden');
    }

    function clearError() {
      authAlert.textContent = '';
      authAlert.classList.add('hidden');
    }

    function switchTab(role) {
      clearError();

      if (role === 'student') {
        studentTab.classList.add('active');
        studentTab.setAttribute('aria-selected', 'true');
        teacherTab.classList.remove('active');
        teacherTab.setAttribute('aria-selected', 'false');

        studentForm.classList.remove('hidden');
        teacherForm.classList.add('hidden');
      } else {
        teacherTab.classList.add('active');
        teacherTab.setAttribute('aria-selected', 'true');
        studentTab.classList.remove('active');
        studentTab.setAttribute('aria-selected', 'false');

        teacherForm.classList.remove('hidden');
        studentForm.classList.add('hidden');
      }
    }

    studentTab.addEventListener('click', () => switchTab('student'));
    teacherTab.addEventListener('click', () => switchTab('teacher'));

    // Live Student Passcode Login
    studentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const btn = document.getElementById('studentSubmitBtn');
      const username = document.getElementById('studentUsername').value.trim().toLowerCase();
      const passcode = document.getElementById('studentPasscode').value.trim();
      const joinCode = document.getElementById('classJoinCode').value.trim().toUpperCase();

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        // Optional: look up class join code first if provided
        let matchedClassId = null;
        if (joinCode) {
          const { data: cls, error: clsErr } = await window.supabaseClient
            .from('classes')
            .select('id')
            .eq('join_code', joinCode)
            .single();

          if (clsErr || !cls) {
            throw new Error('Class join code not found. Double-check the code or leave it blank.');
          }
          matchedClassId = cls.id;
        }

        // Verify student username + passcode (redirects to student.html on success)
        const session = await window.PrepifyAuth.loginStudentWithPasscode(username, passcode);

        // If a join code was entered, enroll the student in that class
        if (matchedClassId && session?.id) {
          await window.supabaseClient
            .from('students')
            .update({ class_id: matchedClassId })
            .eq('id', session.id);

          session.classId = matchedClassId;
          localStorage.setItem('prepify_student_session', JSON.stringify(session));
        }
      } catch (err) {
        showError(err.message || 'Unable to sign in. Please check your username and passcode.');
        btn.disabled = false;
        btn.textContent = 'Enter Student Portal';
      }
    });

    // Live Teacher Email + Password Login
    teacherForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const btn = document.getElementById('teacherSubmitBtn');
      const email = document.getElementById('teacherEmail').value.trim();
      const password = document.getElementById('teacherPassword').value;

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        await window.PrepifyAuth.loginTeacher(email, password);
      } catch (err) {
        showError(err.message || 'Invalid instructor email or password.');
        btn.disabled = false;
        btn.textContent = 'Sign In to Teacher Studio';
      }
    });
  </script>

</body>
</html>
